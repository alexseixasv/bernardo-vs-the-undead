<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bernardo vs. The Undead</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud" class="hud">
        <div class="hud-meters">
          <div class="hud-health">
            <span class="hud-label">Health</span>
            <div class="health-bar" role="meter" aria-label="Health">
              <div id="health-fill" class="health-fill"></div>
            </div>
            <span id="health-text">100/100</span>
          </div>
          <div class="hud-xp">
            <span class="hud-label">Lv <strong id="player-level">1</strong></span>
            <div class="xp-bar" role="meter" aria-label="Experience">
              <div id="xp-fill" class="xp-fill"></div>
            </div>
            <span id="xp-text">0/20</span>
          </div>
        </div>
        <div class="hud-stats">
          <span>Defeated <strong id="kill-count">0</strong></span>
          <span>Time <strong id="run-time">0:00</strong></span>
        </div>
      </div>
      <p id="controls-hint" class="controls-hint">Move: WASD / Arrow Keys</p>
      <button id="mute-button" class="mute-button" type="button" aria-pressed="false">Sound</button>
      <div id="level-up" class="level-up" hidden>
        <div class="level-up-panel">
          <p class="level-up-kicker">Level Up</p>
          <h1 id="level-up-title">Level 2</h1>
          <p class="level-up-copy">Choose one upgrade</p>
          <div id="upgrade-cards" class="upgrade-cards"></div>
          <p class="level-up-hint">Click a card or press 1, 2, or 3</p>
        </div>
      </div>
      <div id="game-over" class="game-over" hidden>
        <div class="game-over-card">
          <h1>Game Over</h1>
          <p>Skeletons defeated: <strong id="game-over-kills">0</strong></p>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </div>
      <div id="boot-error" class="boot-error" hidden role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
